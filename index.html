<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portrait Auto-Battler</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="phase-planning">
    <div id="app">
        <!-- Synergy HUD -->
        <aside id="synergy-hud" class="synergy-hud"></aside>
        
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="stat-box enemy-hp">
                <span class="label">Enemy HP</span>
                <span class="value" id="enemy-hp-val">100</span>
            </div>
            <div class="stat-box capacity">
                <span class="label">Capacity</span>
                <span class="value" id="capacity-val">0/3</span>
            </div>
            <div class="round-indicator">
                <span class="label">Round</span>
                <span class="value" id="round-val">1</span>
            </div>
            <div class="stat-box player-hp">
                <span class="label">Player HP</span>
                <span class="value" id="player-hp-val">100</span>
            </div>
        </header>

        <!-- Battle Board -->
        <main class="board-area">
            <div id="board" class="grid-5x8">
                <!-- Cells will be generated by JS -->
            </div>
        </main>

        <!-- Combat Toggle Button -->
        <button id="btn-toggle-store" class="toggle-store-btn" style="display: none;">
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            Open Store
        </button>

        <!-- Bottom UI Wrapper -->
        <div id="bottom-ui-container" class="bottom-ui-container">
            <!-- Player Bench & Overflow -->
            <section class="bench-area">
                <div id="overflow-bench" class="bench-slots overflow-bench" style="margin-bottom: 6px;"></div>
                <div id="bench" class="bench-slots">
                    <!-- Bench slots generated by JS -->
                </div>
            </section>

            <!-- Shop & Economy -->
            <footer class="shop-area">
                <div class="economy-bar">
                    <div class="level-info">
                        <span class="label">Level <span id="level-val">1</span></span>
                        <div class="xp-bar">
                            <div class="xp-fill" id="xp-fill"></div>
                            <span class="xp-text" id="xp-text">0/2</span>
                        </div>
                    </div>
                    <div class="gold-box">
                        <img src="assets/gold_coin.png" class="coin-icon" alt="Gold"> <span id="gold-val">10</span>
                    </div>
                </div>
                
                <div class="shop-cards" id="shop-cards">
                    <!-- Shop cards generated by JS -->
                </div>

                <div class="shop-actions">
                    <button id="btn-buy-xp" class="action-btn">
                        Level Up
                    </button>
                    <button id="btn-refresh" class="action-btn">
                        Refresh <span class="cost-badge">2 <img src="assets/gold_coin.png" class="coin-icon" alt="Gold"></span>
                    </button>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <!-- Phase / Start Battle Control -->
                    <button id="btn-start-combat" class="phase-btn" style="flex:1;">
                        Start Combat Phase
                    </button>
                    
                    <!-- Fast Forward -->
                    <button id="btn-fast-forward" class="action-btn fast-forward-btn" style="display:none;" title="Fast Forward (Debug)">
                        <svg class="ui-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l9 8-9 8z"></path><path d="M13 4l9 8-9 8z"></path></svg>
                    </button>
                </div>
                
                <!-- Sell Zone Overlay -->
                <div id="sell-zone" class="sell-zone">
                    <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    Drop here to sell for <span id="sell-value">0</span><img src="assets/gold_coin.png" class="coin-icon" alt="Gold">
                </div>
            </footer>
        </div>
    </div>
    
    <div id="tooltip" class="tooltip" style="display:none;"></div>

    <script src="main.js"></script>
</body>
</html>
